<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Working Calculator</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: min(320px, calc(100vw - 32px));
      padding: 16px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    .display {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
      padding: 16px;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      text-align: right;
      font-size: 2rem;
      background: #fafafa;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      padding: 16px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      background: #e9e9e9;
    }

    button.operator,
    button.equals {
      background: #ffb347;
    }

    button.clear {
      background: #ff7b7b;
      color: #fff;
    }

    button.zero {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <main class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="clear" data-action="clear">C</button>
      <button data-action="decimal">.</button>
      <button class="operator" data-action="operator" data-value="/">÷</button>
      <button class="operator" data-action="operator" data-value="*">×</button>

      <button data-action="number" data-value="7">7</button>
      <button data-action="number" data-value="8">8</button>
      <button data-action="number" data-value="9">9</button>
      <button class="operator" data-action="operator" data-value="-">−</button>

      <button data-action="number" data-value="4">4</button>
      <button data-action="number" data-value="5">5</button>
      <button data-action="number" data-value="6">6</button>
      <button class="operator" data-action="operator" data-value="+">+</button>

      <button data-action="number" data-value="1">1</button>
      <button data-action="number" data-value="2">2</button>
      <button data-action="number" data-value="3">3</button>
      <button class="equals" data-action="equals">=</button>

      <button class="zero" data-action="number" data-value="0">0</button>
    </div>
  </main>

  <script>
    const display = document.getElementById('display');
    const buttons = document.querySelector('.buttons');

    let currentValue = '0';
    let firstOperand = null;
    let operator = null;
    let shouldResetDisplay = false;

    const updateDisplay = () => {
      display.textContent = currentValue;
    };

    const inputNumber = (value) => {
      if (shouldResetDisplay) {
        currentValue = value;
        shouldResetDisplay = false;
      } else {
        currentValue = currentValue === '0' ? value : currentValue + value;
      }
      updateDisplay();
    };

    const inputDecimal = () => {
      if (shouldResetDisplay) {
        currentValue = '0';
        shouldResetDisplay = false;
      }
      if (!currentValue.includes('.')) {
        currentValue += '.';
        updateDisplay();
      }
    };

    const calculate = (left, right, nextOperator) => {
      if (nextOperator === '+') return left + right;
      if (nextOperator === '-') return left - right;
      if (nextOperator === '*') return left * right;
      if (nextOperator === '/') return right === 0 ? 'Error' : left / right;
      return right;
    };

    const chooseOperator = (nextOperator) => {
      const inputValue = Number(currentValue);

      if (operator && !shouldResetDisplay) {
        const result = calculate(firstOperand, inputValue, operator);
        currentValue = result === 'Error' ? result : String(result);
        updateDisplay();
        firstOperand = result === 'Error' ? null : Number(currentValue);
      } else {
        firstOperand = inputValue;
      }

      operator = currentValue === 'Error' ? null : nextOperator;
      shouldResetDisplay = true;
    };

    const resetCalculator = () => {
      currentValue = '0';
      firstOperand = null;
      operator = null;
      shouldResetDisplay = false;
      updateDisplay();
    };

    const runEquals = () => {
      if (!operator || shouldResetDisplay) {
        return;
      }

      const result = calculate(firstOperand, Number(currentValue), operator);
      currentValue = result === 'Error' ? result : String(result);
      updateDisplay();
      firstOperand = result === 'Error' ? null : Number(currentValue);
      operator = null;
      shouldResetDisplay = true;
    };

    buttons.addEventListener('click', (event) => {
      const button = event.target.closest('button');

      if (!button) {
        return;
      }

      const { action, value } = button.dataset;

      if (action === 'number') {
        inputNumber(value);
      } else if (action === 'decimal' && currentValue !== 'Error') {
        inputDecimal();
      } else if (action === 'operator' && currentValue !== 'Error') {
        chooseOperator(value);
      } else if (action === 'equals' && currentValue !== 'Error') {
        runEquals();
      } else if (action === 'clear') {
        resetCalculator();
      }
    });
  </script>
</body>
</html>
