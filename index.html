<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Working Calculator</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    .calculator {
      width: min(320px, calc(100vw - 32px));
      padding: 16px;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    .display {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 12px;
      padding: 16px;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      text-align: right;
      font-size: 2rem;
      background: #fafafa;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-areas:
        "clear divide multiply subtract"
        "seven eight nine add"
        "four five six add"
        "one two three equals"
        "zero zero decimal equals";
      gap: 8px;
    }

    .display-label {
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #555;
    }

    button {
      padding: 16px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      background: #e9e9e9;
    }

    button.operator,
    button.equals {
      background: #ffb347;
    }

    button.clear {
      background: #ff7b7b;
      color: #fff;
    }

    .key-clear { grid-area: clear; }
    .key-divide { grid-area: divide; }
    .key-multiply { grid-area: multiply; }
    .key-subtract { grid-area: subtract; }
    .key-add { grid-area: add; }
    .key-equals { grid-area: equals; }
    .key-zero { grid-area: zero; }
    .key-decimal { grid-area: decimal; }
    .key-seven { grid-area: seven; }
    .key-eight { grid-area: eight; }
    .key-nine { grid-area: nine; }
    .key-four { grid-area: four; }
    .key-five { grid-area: five; }
    .key-six { grid-area: six; }
    .key-one { grid-area: one; }
    .key-two { grid-area: two; }
    .key-three { grid-area: three; }
  </style>
</head>
<body>
  <main class="calculator">
    <div class="display-label" id="display-label">Display</div>
    <output class="display" id="display" aria-labelledby="display-label" aria-live="polite" aria-atomic="true">0</output>
    <div class="buttons">
      <button class="clear key-clear" data-action="clear" aria-label="Clear">C</button>
      <button class="operator key-divide" data-action="operator" data-value="/" aria-label="Divide">÷</button>
      <button class="operator key-multiply" data-action="operator" data-value="*" aria-label="Multiply">×</button>
      <button class="operator key-subtract" data-action="operator" data-value="-" aria-label="Subtract">−</button>

      <button class="key-seven" data-action="number" data-value="7">7</button>
      <button class="key-eight" data-action="number" data-value="8">8</button>
      <button class="key-nine" data-action="number" data-value="9">9</button>
      <button class="operator key-add" data-action="operator" data-value="+" aria-label="Add">+</button>

      <button class="key-four" data-action="number" data-value="4">4</button>
      <button class="key-five" data-action="number" data-value="5">5</button>
      <button class="key-six" data-action="number" data-value="6">6</button>

      <button class="key-one" data-action="number" data-value="1">1</button>
      <button class="key-two" data-action="number" data-value="2">2</button>
      <button class="key-three" data-action="number" data-value="3">3</button>

      <button class="zero key-zero" data-action="number" data-value="0">0</button>
      <button class="key-decimal" data-action="decimal" aria-label="Decimal point">.</button>
      <button class="equals key-equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <script>
    const display = document.getElementById('display');
    const buttons = document.querySelector('.buttons');

    let currentValue = '0';
    let firstOperand = null;
    let operator = null;
    let shouldResetDisplay = false;

    const updateDisplay = () => {
      display.textContent = currentValue;
    };

    const showError = () => {
      currentValue = 'Error';
      firstOperand = null;
      operator = null;
      shouldResetDisplay = true;
      updateDisplay();
    };

    const inputNumber = (value) => {
      if (shouldResetDisplay) {
        currentValue = value;
        shouldResetDisplay = false;
      } else {
        currentValue = currentValue === '0' ? value : currentValue + value;
      }
      updateDisplay();
    };

    const inputDecimal = () => {
      if (shouldResetDisplay) {
        currentValue = currentValue === 'Error' ? '0' : currentValue;
        shouldResetDisplay = false;
      }
      if (!currentValue.includes('.')) {
        currentValue += '.';
        updateDisplay();
      }
    };

    const calculate = (left, right, nextOperator) => {
      if (nextOperator === '+') return left + right;
      if (nextOperator === '-') return left - right;
      if (nextOperator === '*') return left * right;
      if (nextOperator === '/') return right === 0 ? 'Error' : left / right;
      return right;
    };

    const chooseOperator = (nextOperator) => {
      const inputValue = Number(currentValue);

      if (operator && !shouldResetDisplay) {
        const result = calculate(firstOperand, inputValue, operator);
        if (result === 'Error') {
          showError();
          return;
        }

        currentValue = String(result);
        updateDisplay();
        firstOperand = Number(currentValue);
      } else {
        firstOperand = inputValue;
      }

      operator = nextOperator;
      shouldResetDisplay = true;
    };

    const resetCalculator = () => {
      currentValue = '0';
      firstOperand = null;
      operator = null;
      shouldResetDisplay = false;
      updateDisplay();
    };

    const runEquals = () => {
      if (!operator || shouldResetDisplay) {
        return;
      }

      const result = calculate(firstOperand, Number(currentValue), operator);
      if (result === 'Error') {
        showError();
        return;
      }

      currentValue = String(result);
      updateDisplay();
      firstOperand = Number(currentValue);
      operator = null;
      shouldResetDisplay = true;
    };

    buttons.addEventListener('click', (event) => {
      const button = event.target.closest('button');

      if (!button) {
        return;
      }

      const { action, value } = button.dataset;

      if (action === 'number') {
        inputNumber(value);
      } else if (action === 'decimal') {
        inputDecimal();
      } else if (action === 'operator' && currentValue !== 'Error') {
        chooseOperator(value);
      } else if (action === 'equals' && currentValue !== 'Error') {
        runEquals();
      } else if (action === 'clear') {
        resetCalculator();
      }
    });
  </script>
</body>
</html>
